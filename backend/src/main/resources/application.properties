spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/moneylog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT 설정 - 비밀키는 환경변수(JWT_SECRET)로 관리, access 30분, refresh 7일
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# 구글 OAuth2 로그인 설정 - 클라이언트 ID/시크릿은 환경변수로 관리
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# 프론트엔드 주소 - OAuth2 로그인 성공/실패 후 리다이렉트 주소 (실제 도메인)
app.frontend-url=http://localhost:5173

# Redis 설정 - 로컬 Docker 컨테이너(moneylog-redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379